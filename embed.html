<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get 1 Week Free</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<!--
  Embeddable lead form for another site or app (e.g. a SaaS signup page): the same white card as the
  opt-in on /discord, sending each lead to the Google Sheet and GoHighLevel, marked as coming from here.

  Embed:
    <iframe id="ricky-free-week" src="https://rickyshoffner.com/embed" title="Get 1 week free"
            style="width:100%;max-width:460px;height:360px;border:0;background:transparent"></iframe>

  Options (add to the src as ?name=value, URL-encoded):
    title     heading on the card                      default "Get 1 Week Free"
    button    button text                              default "Get My Free Week"
    note      small line under the button              default none
    success   line shown after they sign up            default "We'll be in touch shortly."
    source    label for the sheet + GHL note and tag   default "SaaS"
    redirect  page to send them to after signing up; {name} {email} {phone} are filled in
    utm_source, utm_medium, utm_campaign, utm_content, utm_term   passed on as usual

  Messages to the page around it (window.postMessage):
    { type: "ricky-embed:height", height }            resize the iframe to fit
    { type: "ricky-embed:lead", name, email, phone }   a lead was captured
-->
<style>
:root {
  --deep: #0c2f78;
  --gold: #f7c948;
  --gold-2: #e6a417;
  --gold-ink: #241a02;
  --card: #ffffff;
  --card-ink: #111a2e;
  --card-muted: #66708a;
  --field: #eef0f3;
  --field-line: #d3d7dd;
  --field-done: #ffffff;
  --danger: #d93a3a;
  --display: "Montserrat", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font-family: var(--body); color: var(--card-ink); padding: 8px 10px 16px; -webkit-font-smoothing: antialiased; }
.card {
  width: 100%; max-width: 440px; margin: 0 auto;
  display: grid; gap: 12px;
  padding: 24px clamp(18px, 5vw, 26px) 20px;
  background: var(--card); border-radius: 20px;
  box-shadow: 0 10px 30px rgba(10, 20, 45, .18);
}
h1 {
  margin: 0; font-family: var(--display); font-size: clamp(1.3rem, 6vw, 1.6rem); font-weight: 800; line-height: 1.2;
  display: flex; justify-content: center; align-items: center; gap: 10px; text-align: center;
}
h1 svg { flex: none; width: 1.05em; height: 1.05em; color: var(--deep); }
.input, .select {
  width: 100%; min-height: 46px; padding: 12px 14px;
  font: inherit; font-size: 1rem; color: var(--card-ink);
  background: var(--field); border: 1px solid var(--field-line); border-radius: 10px;
  transition: background-color .15s ease, border-color .15s ease;
}
.input::placeholder { color: #8a9099; }
.input:focus, .input:not(:placeholder-shown) { background: var(--field-done); }
.input:focus, .select:focus { outline: none; border-color: var(--deep); box-shadow: 0 0 0 3px rgba(12, 47, 120, .15); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.phone { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.phone .select { width: auto; padding-right: 8px; }
.error { margin: 0; color: var(--danger); font-size: .8rem; }
.btn {
  width: 100%; padding: 15px 18px; margin-top: 2px;
  font: inherit; font-family: var(--display); font-size: 1rem; font-weight: 800; color: var(--gold-ink);
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  border: 0; border-radius: 12px; cursor: pointer;
  box-shadow: 0 8px 22px rgba(230, 164, 23, .35), inset 0 1px 0 rgba(255, 255, 255, .5);
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .6; cursor: wait; transform: none; }
.note { margin: 0; text-align: center; font-size: .8rem; font-weight: 500; color: var(--card-muted); }
.done { display: grid; justify-items: center; gap: 6px; padding: 18px 0 8px; text-align: center; }
.done svg { width: 48px; height: 48px; }
.done strong { font-family: var(--display); font-size: 1.25rem; }
.done span { color: var(--card-muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form class="card" id="form" novalidate>
  <h1>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-1.5-3-5-4-6-2s2 2 6 2zm0 0c1.5-3 5-4 6-2s-2 2-6 2z"/></svg>
    <span id="title">Get 1 Week Free</span>
  </h1>
  <div id="fields" style="display:grid;gap:12px">
    <input class="input" id="name" name="name" autocomplete="name" placeholder="Full Name*" aria-label="Full name" required>
    <div class="phone">
      <select class="select" id="cc" aria-label="Country code">
        <option value="+1" data-country="US">🇺🇸 +1</option>
        <option value="+1" data-country="CA">🇨🇦 +1</option>
        <option value="+44" data-country="GB">🇬🇧 +44</option>
        <option value="+61" data-country="AU">🇦🇺 +61</option>
        <option value="+49" data-country="DE">🇩🇪 +49</option>
        <option value="+971" data-country="AE">🇦🇪 +971</option>
      </select>
      <input class="input" id="phone" name="phone" type="tel" autocomplete="tel-national" placeholder="Phone*" aria-label="Phone" required>
    </div>
    <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="Email*" aria-label="Email" required>
    <p class="error" id="error" role="alert" hidden></p>
    <button class="btn" type="submit" id="submit">Get My Free Week</button>
    <p class="note" id="note" hidden></p>
  </div>
  <div class="done" id="done" hidden>
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#16a34a"/><path d="M14 25l7 7 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <strong id="done-title">You're in!</strong>
    <span id="done-text">We'll be in touch shortly.</span>
  </div>
</form>

<script src="/assets/lead-form.js"></script>
<script>
// Same Apps Script as the funnel (CONFIG.leadSheetUrl in index.html).
const LEAD_SHEET_URL = "https://script.google.com/macros/s/AKfycbzhPVpu96QKl-C44twFcFtajEkUGAh5MM2aHBIC6n5HfCSuqZx-SRiqSth_KrkV-4jC/exec";

const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const opt = (k, d) => (qs.get(k) || d).trim();
const source = opt("source", "SaaS");
$("#title").textContent = opt("title", "Get 1 Week Free");
$("#submit").textContent = opt("button", "Get My Free Week");
$("#done-text").textContent = opt("success", "We'll be in touch shortly.");
if (qs.get("note")) { $("#note").textContent = qs.get("note"); $("#note").hidden = false; }

// Tell the page around us how tall the card is, so it can size the iframe (see the embed code above).
const tell = msg => { try { parent.postMessage(msg, "*"); } catch {} };
// (The body's own height: the document's would never shrink below the iframe it sits in.)
new ResizeObserver(() => tell({ type: "ricky-embed:height", height: Math.ceil(document.body.getBoundingClientRect().height) })).observe(document.body);

const cc = $("#cc"), phone = $("#phone");
const country = () => cc.selectedOptions[0].dataset.country;
function readField() {
  const raw = phone.value.trim();
  if (!raw) return null;
  const p = readPhone(raw, country());
  if (p.country !== country()) [...cc.options].find(o => o.dataset.country === p.country).selected = true;
  return p;
}
phone.addEventListener("blur", () => {
  const p = readField();
  if (!p) return;
  phone.setAttribute("aria-invalid", !p.ok);
  if (p.ok) phone.value = formatPhone(p.national, p.country);
});
phone.addEventListener("input", () => { if (phone.getAttribute("aria-invalid") === "true" && readField()?.ok) phone.removeAttribute("aria-invalid"); });

$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const nameEl = $("#name"), emailEl = $("#email");
  nameEl.value = tidyName(nameEl.value);
  const name = nameEl.value, email = emailEl.value.trim(), p = readField(), c = country();
  const bad = [];
  nameEl.setAttribute("aria-invalid", !name); if (!name) bad.push("your name");
  phone.setAttribute("aria-invalid", !p?.ok);
  if (!p) bad.push("a phone number");
  else if (!p.ok) bad.push("a valid " + (c === "GB" ? "UK" : c) + " phone number (" + PHONE_RULES[c].hint + ")");
  emailEl.setAttribute("aria-invalid", !emailOk(email)); if (!emailOk(email)) bad.push("a valid email");
  const err = $("#error");
  if (bad.length) { err.textContent = "Please add " + bad.join(", ") + "."; err.hidden = false; return; }
  err.hidden = true;
  $("#submit").disabled = true;

  // signup + version mark the lead as coming from this embed, in the sheet and in GoHighLevel.
  const body = new URLSearchParams({
    type: "optin", signup: source, version: source,
    name, email, phone: p.e164, country: c,
    funnel: "Embed – " + $("#title").textContent,
    page_url: document.referrer || location.href,
    ...Object.fromEntries(["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"].map(k => [k, qs.get(k) || ""])),
    referrer: document.referrer,
    device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "Mobile" : "Desktop",
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
  });
  // Apps Script doesn't send CORS headers, so the answer can't be read; "no-cors" still delivers the lead.
  fetch(LEAD_SHEET_URL, { method: "POST", mode: "no-cors", body, keepalive: true }).catch(() => {});
  tell({ type: "ricky-embed:lead", name, email, phone: p.e164 });

  const next = qs.get("redirect");
  if (next) {
    const url = next.replace(/\{name\}/g, encodeURIComponent(name)).replace(/\{email\}/g, encodeURIComponent(email)).replace(/\{phone\}/g, encodeURIComponent(p.e164));
    try { window.top.location.href = url; return; } catch { location.href = url; return; }
  }
  $("#fields").hidden = true;
  $("#done-title").textContent = "You're in, " + name.split(" ")[0] + "! 🎉";
  $("#done").hidden = false;
});
</script>
</body>
</html>
